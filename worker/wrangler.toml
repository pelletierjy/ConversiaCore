name = "conversia-core-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
# DEEPSEEK_API_KEY must be set as a Worker Secret:
#   echo $DEEPSEEK_API_KEY | wrangler secret put DEEPSEEK_API_KEY

# HUGGING_FACE_API_KEY must be set as a Worker Secret:
#   echo $HUGGING_FACE_API_KEY | wrangler secret put HUGGING_FACE_API_KEY
# Or via the Cloudflare dashboard: Settings → Variables → Secrets
