<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- signal-grid web component: webpack runtime, zone polyfills, then the element bundle -->
    <!-- Injected from an inline script (not <script src>) because the files live in /public:
         Vite's dev server otherwise tries to transform them and logs "Pre-transform error".
         async=false keeps the three modules executing in order. -->
    <script>
      ['runtime', 'polyfills', 'main'].forEach(function (name) {
        var el = document.createElement('script');
        el.type = 'module';
        el.async = false;
        el.src = '%BASE_URL%vendor/signal-grid/' + name + '.js';
        document.head.appendChild(el);
      });
    </script>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('gh_pages_redirect');
        if (redirect) {
          sessionStorage.removeItem('gh_pages_redirect');
          if (redirect !== location.href) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
