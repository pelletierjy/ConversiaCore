<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app"></div>
    <!-- signal-grid web component: webpack runtime, zone polyfills, then the element bundle -->
    <script src="/vendor/signal-grid/runtime.js" type="module"></script>
    <script src="/vendor/signal-grid/polyfills.js" type="module"></script>
    <script src="/vendor/signal-grid/main.js" type="module"></script>
    <script>
      (function () {
        var redirect = sessionStorage.getItem('gh_pages_redirect');
        if (redirect) {
          sessionStorage.removeItem('gh_pages_redirect');
          if (redirect !== location.href) {
            history.replaceState(null, '', redirect);
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
